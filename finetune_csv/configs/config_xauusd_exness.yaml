# Cấu hình Huấn luyện Tinh chỉnh Kronos trên dữ liệu Vàng (XAUUSDm) Exness M5
# File: finetune_csv/configs/config_xauusd_exness.yaml

data:
  data_path: "finetune_csv/data/XAUUSDm_M5_exness.csv"
  lookback_window: 450
  predict_window: 6
  max_context: 512
  clip: 5.0
  train_ratio: 0.90
  val_ratio: 0.10
  test_ratio: 0.0

training:
  tokenizer_epochs: 15
  basemodel_epochs: 12
  batch_size: 16
  log_interval: 25
  num_workers: 2
  seed: 42
  
  tokenizer_learning_rate: 0.0001
  predictor_learning_rate: 0.0000008
  
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.05
  accumulation_steps: 2

model_paths:
  pretrained_tokenizer: "model/weights/Kronos-Tokenizer-base"
  pretrained_predictor: "model/weights/Kronos-base"
  exp_name: "Kronos-Gold-Exness"
  base_path: "model/weights/"

  base_save_path: "model/weights/Kronos-Gold-Exness"
  finetuned_tokenizer: "model/weights/Kronos-Tokenizer-Gold-Exness"
  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_gold_exness_finetune"
  description: "Finetune Kronos-base trên 60,000 nến M5 XAUUSD sàn Exness"
  use_comet: false
  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 0

